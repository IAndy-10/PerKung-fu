[package]
name = "haptic-perc-nih"
version = "0.1.0"
edition = "2021"

# cdylib  → VST3 / CLAP plugin binary
# lib     → rlib used by the standalone binary target below
[lib]
name = "haptic_perc_nih"
crate-type = ["cdylib", "lib"]

# Standalone audio application (needs --features standalone)
[[bin]]
name = "haptic-perc"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nih_plug/standalone"]

[dependencies]
nih_plug = { path = "../nih-plug" }
nih_plug_egui = { path = "../nih-plug/nih_plug_egui" }
